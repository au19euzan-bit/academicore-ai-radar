name: Radar günlük güncelleme

on:
  schedule:
    - cron: "47 4 * * *"   # her gün 07:47 (Türkiye saati)
  workflow_dispatch: {}     # Actions sekmesinden elle çalıştırma
  push:                     # ajan ya da kaynak listesi değişince hemen çalışır
    branches: [main]
    paths: ["radar_ajan.py", "kaynaklar/**", "build_katalog.py", ".github/workflows/radar.yml"]

permissions:
  contents: write

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  guncelle:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main          # elle çalıştırmada da en güncel hâli al
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Kataloğu derle (kaynaklar/ -> sources.js, sources.json)
        run: python build_katalog.py
      - name: Kaynakları oku
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RADAR_MAILTO: ${{ vars.RADAR_MAILTO }}
        run: python radar_ajan.py
      - name: Değiştiyse kaydet
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add data/ sources.js source-areas.js sources.json index.html version.json sw.js
          git diff --cached --quiet && exit 0
          git commit -m "Radar: günlük güncelleme ve katalog derlemesi"
          # bu arada depoya başka bir değişiklik geldiyse önce onu al
          git pull --rebase origin main
          git push
