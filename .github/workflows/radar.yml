name: Radar günlük güncelleme

on:
  schedule:
    - cron: "47 4 * * *"   # her gün 07:47 (Türkiye saati)
  workflow_dispatch: {}     # Actions sekmesinden elle çalıştırma

permissions:
  contents: write

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  guncelle:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Kaynakları oku
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RADAR_MAILTO: ${{ vars.RADAR_MAILTO }}
        run: python radar_ajan.py
      - name: Değiştiyse kaydet
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Radar: günlük güncelleme"
          git push
