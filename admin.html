<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Radar Yönetimi</title>
<meta name="theme-color" content="#0A0A0B">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: same identity as the reader — black brand bar, one 720px column: sign-in card, or run status + grouped source list + inline add/edit form, with a sticky save bar when there are unsaved changes */
:root {
  --bg: #F6F4F5; --surface: #FFFFFF; --sunken: #EFEBED; --fg: #1B1719; --muted: #6B6266; --faint: #9A9094; --line: #E5DEE1;
  --accent: #8E2639; --accent-fg: #FFFFFF; --accent-soft: #F6E6EA; --ok: #2F7D6B; --ok-soft: #E2F1EC;
  --warn: #6B4A08; --warn-soft: #FFF3DC; --bad: #A3271F; --bad-soft: #FBE7E5;
  --head-bg: #0A0A0B; --head-fg: #FFFFFF; --head-accent: #F0506A;
  --f-aka: #2F7D6B; --f-der: #8E2639; --f-kur: #2C61A8; --f-yz: #6A4FB3; --f-sho: #B4531C;
  --font: "Inter", -apple-system, "Segoe UI", system-ui, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #121011; --surface: #1C191A; --sunken: #262223; --fg: #F2EEF0; --muted: #A69CA0; --faint: #7D7478; --line: #332D2F;
    --accent: #F0657C; --accent-fg: #1B0A0E; --accent-soft: #3A1F25; --ok: #5FBF9A; --ok-soft: #1A2E27;
    --warn: #F2D493; --warn-soft: #2E2614; --bad: #FF8A80; --bad-soft: #3A1B19; --head-bg: #000000;
    --f-aka: #5FBF9A; --f-der: #F0657C; --f-kur: #73A6EC; --f-yz: #A08BE8; --f-sho: #EE9A62;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--fg); font: 15px/1.45 var(--font); letter-spacing: -0.01em; -webkit-text-size-adjust: 100%; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--accent); }
svg { display: block; }
.gut { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.wrap { max-width: 720px; margin: 0 auto; }

.top { background: var(--head-bg); color: var(--head-fg); padding-top: env(safe-area-inset-top, 0px); }
.top .wrap { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 14px; }
.brand { font-size: 19px; font-weight: 800; letter-spacing: -0.03em; }
.brand span { color: var(--head-accent); }
.brand small { font-size: 13px; font-weight: 600; color: #B9B3B6; margin-left: 8px; letter-spacing: 0; }
.toplink { color: #D9D3D6; font-size: 14px; font-weight: 600; text-decoration: none; white-space: nowrap; }

main { padding-block: 20px calc(110px + env(safe-area-inset-bottom, 0px)); }
.stack { display: flex; flex-direction: column; gap: 16px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 18px; }
h1 { margin: 0; font-size: 24px; letter-spacing: -0.02em; text-wrap: balance; }
h2 { margin: 0; font-size: 13px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
h3 { margin: 0; font-size: 17px; }
p { margin: 0; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
ol.steps { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 6px; line-height: 1.5; }
code { font-family: var(--mono); font-size: 0.9em; background: var(--sunken); padding: 1px 5px; border-radius: 5px; }

.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field label { font-size: 13px; font-weight: 600; }
.field .hint { font-size: 12px; color: var(--muted); }
input[type=text], input[type=password], input[type=url], select {
  width: 100%; min-width: 0; height: 44px; padding: 0 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); font-size: 16px;
}
input:focus-visible, select:focus-visible, button:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
@media (max-width: 520px) { .grid2 { grid-template-columns: 1fr; } }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 40px; padding: 8px 16px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); font-size: 14px; font-weight: 700; text-decoration: none; color: var(--fg); white-space: nowrap; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
.btn.soft { background: var(--accent-soft); border-color: transparent; color: var(--accent); }
.btn.danger { color: var(--bad); }
.btn:disabled { opacity: 0.5; cursor: default; }
.btn svg { width: 15px; height: 15px; }
.linkbtn { background: none; border: none; padding: 4px 6px; font-size: 14px; font-weight: 600; color: var(--accent); border-radius: 6px; }
.linkbtn.danger { color: var(--bad); }

.msg { border-radius: 10px; padding: 10px 12px; font-size: 14px; line-height: 1.45; }
.msg.bad { background: var(--bad-soft); color: var(--bad); }
.msg.warn { background: var(--warn-soft); color: var(--warn); }
.msg.ok { background: var(--ok-soft); color: var(--ok); }

.runcard { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.runinfo { display: flex; align-items: center; gap: 10px; min-width: 0; }
.dot { width: 10px; height: 10px; border-radius: 50%; flex: none; background: var(--faint); }
.dot.ok { background: var(--ok); } .dot.bad { background: var(--bad); } .dot.run { background: #D69A1E; animation: pulse 1.2s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: 0.35; } }
@media (prefers-reduced-motion: reduce) { .dot.run { animation: none; } }

.group { display: flex; flex-direction: column; gap: 8px; }
.grouphead { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.grouphead h2 { display: flex; align-items: center; gap: 8px; }
.sw { width: 9px; height: 9px; border-radius: 50%; }
.list { list-style: none; margin: 0; padding: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; }
.src { display: grid; grid-template-columns: 34px minmax(0, 1fr) auto; gap: 12px; align-items: start; padding: 14px; }
.src + .src { border-top: 1px solid var(--line); }
.src.off .name, .src.off .addr { color: var(--faint); }
.ini { width: 34px; height: 34px; border-radius: 9px; display: grid; place-items: center; font-size: 12px; font-weight: 800; color: #fff; }
.srcmain { min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.name { font-weight: 700; overflow-wrap: anywhere; }
.addr { font-size: 13px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 2px; }
.chip { display: inline-block; padding: 2px 8px; border-radius: 6px; font-size: 12px; font-weight: 600; background: var(--sunken); color: var(--muted); }
.chip.ok { background: var(--ok-soft); color: var(--ok); }
.chip.bad { background: var(--bad-soft); color: var(--bad); }
.chip.warn { background: var(--warn-soft); color: var(--warn); }
.chip.pend { background: var(--accent-soft); color: var(--accent); }
.srcacts { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
.srcacts .row { gap: 2px; justify-content: flex-end; }
.confirm { display: flex; align-items: center; gap: 4px; font-size: 13px; color: var(--bad); font-weight: 600; flex-wrap: wrap; justify-content: flex-end; }

.switch { display: inline-flex; align-items: center; gap: 8px; background: none; border: none; padding: 4px 0; font-size: 13px; color: var(--muted); }
.track { width: 40px; height: 24px; border-radius: 999px; background: var(--line); position: relative; flex: none; }
.track::after { content: ""; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,0.25); transition: transform 0.15s; }
.switch[aria-checked="true"] .track { background: var(--ok); }
.switch[aria-checked="true"] .track::after { transform: translateX(16px); }
@media (prefers-reduced-motion: reduce) { .track::after { transition: none; } }

.formcard { border: 2px solid var(--accent); }
.formcard .stack { gap: 14px; }

.savebar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; background: var(--head-bg); color: var(--head-fg); padding-block: 12px calc(12px + env(safe-area-inset-bottom, 0px)); }
.savebar .wrap { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.savebar .btn:not(.primary) { background: transparent; color: var(--head-fg); border-color: #3A3537; }
.toast { position: fixed; left: 50%; bottom: calc(90px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-size: 14px; font-weight: 600; z-index: 30; max-width: min(520px, calc(100% - 32px)); text-align: center; }
</style>
</head>
<body>
<header class="top gut"><div class="wrap">
  <div class="brand">AcademiCore <span>AI</span> Radar<small>Yönetim</small></div>
  <a class="toplink" href="./">Okuyucuya dön</a>
</div></header>

<main class="gut"><div class="wrap stack" id="view"></div></main>
<div class="savebar gut" id="savebar" hidden><div class="wrap">
  <div id="savetext"></div>
  <div class="row"><button class="btn" type="button" id="discard">Vazgeç</button><button class="btn primary" type="button" id="save">Kaydet</button></div>
</div></div>
<div class="toast" id="toast" role="status" hidden></div>

<script>
(function () {
  // Depo: github.io adresinden okunur, yoksa varsayilan
  var OWNER = "au19euzan-bit", REPO = "academicore-ai-radar", BRANCH = "main", WORKFLOW = "radar.yml";
  if (/\.github\.io$/.test(location.hostname)) {
    OWNER = location.hostname.split(".")[0];
    var seg = location.pathname.split("/").filter(Boolean)[0];
    if (seg && !/\.html$/.test(seg)) REPO = seg;
  }
  var API = "https://api.github.com/repos/" + OWNER + "/" + REPO;
  var TOKEN_KEY = "radar-admin-token";

  var TYPES = [
    { key: "rss", label: "Blog ya da haber sitesi (RSS)", field: "Site ya da RSS adresi", ph: "https://ornek.com/blog", hint: "Sitenin ana adresi yeterli; ajan RSS akışını kendisi bulur." },
    { key: "yt-shorts", label: "YouTube kanalı · Shorts", field: "Kanal adresi", ph: "https://www.youtube.com/@kanal", hint: "Kanal sayfasının adresi (@ ile başlayan). Yalnızca Shorts videoları gelir." },
    { key: "yt-long", label: "YouTube kanalı · uzun videolar", field: "Kanal adresi", ph: "https://www.youtube.com/@kanal", hint: "Kanal sayfasının adresi (@ ile başlayan). Shorts dışındaki videolar gelir." },
    { key: "crossref", label: "Akademik dergi (ISSN ile)", field: "ISSN", ph: "0360-1315", hint: "Derginin çevrimiçi (e-ISSN) ya da basılı ISSN numarası. Son 30 günün makaleleri gelir." },
    { key: "page", label: "RSS'i olmayan haber sayfası", field: "Sayfa adresi", ph: "https://ornek.org/haberler", hint: "Haberlerin listelendiği sayfa. Bu tür, depoya API anahtarı eklenmeden okunmaz." }
  ];
  var TYPE = {}; TYPES.forEach(function (t) { TYPE[t.key] = t; });
  var METHOD_LABEL = { rss: "RSS", crossref: "Crossref", youtube: "YouTube", page: "Sayfa" };

  var S = { token: null, login: "", catalog: null, sha: null, original: "", status: null, run: null,
            form: null, confirmDel: null, busy: false, authError: "", loadError: "", polling: null };

  function readToken() { try { return localStorage.getItem(TOKEN_KEY); } catch (e) { return null; } }
  function writeToken(t) { try { if (t) localStorage.setItem(TOKEN_KEY, t); else localStorage.removeItem(TOKEN_KEY); } catch (e) {} }

  function el(tag, cls, text) { var n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; }
  function btn(cls, text, fn) { var b = el("button", cls, text); b.type = "button"; if (fn) b.addEventListener("click", fn); return b; }
  var toastT = null;
  function toast(msg, ms) { var t = document.getElementById("toast"); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(function () { t.hidden = true; }, ms || 3200); }

  function b64decode(s) { var bin = atob(s.replace(/\s/g, "")); var u = new Uint8Array(bin.length); for (var i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i); return new TextDecoder().decode(u); }
  function b64encode(str) { var u = new TextEncoder().encode(str), bin = ""; for (var i = 0; i < u.length; i++) bin += String.fromCharCode(u[i]); return btoa(bin); }

  function gh(path, opts) {
    opts = opts || {};
    var headers = { "Accept": opts.accept || "application/vnd.github+json", "Authorization": "Bearer " + S.token, "X-GitHub-Api-Version": "2022-11-28" };
    if (opts.body) headers["Content-Type"] = "application/json";
    return fetch(path.indexOf("http") === 0 ? path : API + path, { method: opts.method || "GET", headers: headers, body: opts.body ? JSON.stringify(opts.body) : undefined, cache: "no-store" })
      .then(function (r) {
        if (r.status === 204) return null;
        return r.text().then(function (t) {
          var data = null; try { data = t ? JSON.parse(t) : null; } catch (e) { data = t; }
          if (!r.ok) { var err = new Error((data && data.message) || ("HTTP " + r.status)); err.status = r.status; throw err; }
          return data;
        });
      });
  }

  // ---------------------------------------------------------------- yardimcilar
  var TR = { "ç": "c", "ğ": "g", "ı": "i", "İ": "i", "ö": "o", "ş": "s", "ü": "u", "Ç": "c", "Ğ": "g", "Ö": "o", "Ş": "s", "Ü": "u" };
  function slug(s) { return (s || "").replace(/[çğıİöşüÇĞÖŞÜ]/g, function (c) { return TR[c]; }).toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "").slice(0, 32) || "kaynak"; }
  function uniqueId(base, taken) { var id = base, n = 2; while (taken[id]) id = base + "-" + n++; return id; }
  function autoIni(name) {
    var w = (name || "").replace(/[·|:–—-]/g, " ").split(/\s+/).filter(function (x) { return /[0-9A-Za-zÇĞİÖŞÜçğıöşü]/.test(x); });
    if (!w.length) return "?";
    return (w.length === 1 ? w[0].slice(0, 2) : w[0][0] + w[1][0]).toLocaleUpperCase("tr-TR");
  }
  function isHttp(u) { try { var x = new URL(u); return x.protocol === "https:" || x.protocol === "http:"; } catch (e) { return false; } }
  function cleanUrl(u) { u = (u || "").trim(); if (u && !/^https?:\/\//i.test(u)) u = "https://" + u; return u; }
  function normIssn(s) { var d = (s || "").replace(/[^0-9Xx]/g, "").toUpperCase(); return d.length === 8 ? d.slice(0, 4) + "-" + d.slice(4) : null; }
  function typeOf(s) { return s.method === "youtube" ? (s.kind === "long" ? "yt-long" : "yt-shorts") : s.method; }
  function addressOf(s) {
    if (s.method === "rss") return s.feed || s.home || "";
    if (s.method === "youtube") return s.home || (s.channel ? "https://www.youtube.com/channel/" + s.channel : "");
    if (s.method === "crossref") return s.issn || "";
    return s.page || s.home || "";
  }
  function folderColor(id) { return "var(--f-" + id + ", var(--muted))"; }
  function dayStart(t) { var x = new Date(t); x.setHours(0, 0, 0, 0); return x.getTime(); }
  var tFmt = new Intl.DateTimeFormat("tr-TR", { hour: "2-digit", minute: "2-digit" });
  var dFmt = new Intl.DateTimeFormat("tr-TR", { day: "numeric", month: "long" });
  function when(iso) {
    var t = new Date(iso).getTime(); if (isNaN(t)) return "";
    var d = Math.round((dayStart(Date.now()) - dayStart(t)) / 864e5);
    return (d === 0 ? "bugün " : d === 1 ? "dün " : dFmt.format(new Date(t)) + " ") + tFmt.format(new Date(t));
  }
  function currentJSON() { return JSON.stringify(S.catalog, null, 2) + "\n"; }
  function isDirty() { return S.catalog && currentJSON() !== S.original; }
  function originalSources() { try { return JSON.parse(S.original).sources || []; } catch (e) { return []; } }

  // ---------------------------------------------------------------- veri
  function connect(token) {
    S.token = token; S.authError = ""; S.busy = true; render();
    return gh("https://api.github.com/user").then(function (u) { S.login = (u && u.login) || ""; }).catch(function () {})
      .then(function () { return loadCatalog(); })
      .then(function () { writeToken(token); S.busy = false; render(); loadStatus(); loadRun(); })
      .catch(function (e) {
        S.busy = false; S.token = null; S.catalog = null;
        S.authError = e.status === 401 ? "Anahtar geçersiz ya da süresi dolmuş." :
          e.status === 404 || e.status === 403 ? "Bu anahtarın " + REPO + " deposuna erişimi yok. Anahtarı oluştururken bu depoyu seçtiğinizden emin olun." :
          "GitHub'a bağlanılamadı: " + e.message;
        writeToken(null); render();
      });
  }
  function loadCatalog() {
    return gh("/contents/sources.json?ref=" + BRANCH).then(function (d) {
      S.sha = d.sha; S.catalog = JSON.parse(b64decode(d.content));
      S.catalog.folders = S.catalog.folders || []; S.catalog.sources = S.catalog.sources || [];
      S.original = currentJSON();
    });
  }
  function loadStatus() {
    return gh("/contents/data/status.json?ref=" + BRANCH, { accept: "application/vnd.github.raw+json" })
      .then(function (d) { S.status = typeof d === "string" ? JSON.parse(d) : d; render(); }).catch(function () {});
  }
  function loadRun() {
    return gh("/actions/workflows/" + WORKFLOW + "/runs?per_page=1&branch=" + BRANCH).then(function (d) {
      var r = d && d.workflow_runs && d.workflow_runs[0];
      // Kaydet ya da Simdi guncelle sonrasi yeni calisma birkac saniye gec gorunur; eskisini sayma
      if (S.expectAfter) {
        var fresh = r && new Date(r.created_at).getTime() >= S.expectAfter - 30000;
        if (!fresh && Date.now() - S.expectAfter < 180000) { S.run = { status: "queued" }; render(); startPolling(); return; }
        S.expectAfter = null;
      }
      S.run = r ? { status: r.status, conclusion: r.conclusion, at: r.updated_at || r.created_at, url: r.html_url } : { none: true };
      render();
      if (r && r.status !== "completed") startPolling(); else if (S.polling) { stopPolling(); loadStatus(); }
    }).catch(function (e) { S.run = { denied: e.status === 403 || e.status === 404 }; render(); });
  }
  function startPolling() { if (!S.polling) S.polling = setInterval(loadRun, 15000); }
  function stopPolling() { clearInterval(S.polling); S.polling = null; }

  function runNow() {
    gh("/actions/workflows/" + WORKFLOW + "/dispatches", { method: "POST", body: { ref: BRANCH } })
      .then(function () { toast("Güncelleme başlatıldı. Birkaç dakika sürer."); S.expectAfter = Date.now(); S.run = { status: "queued" }; render(); setTimeout(loadRun, 4000); startPolling(); })
      .catch(function (e) { toast(e.status === 403 || e.status === 404 ? "Bu düğme için anahtara Actions izni de vermeniz gerekiyor." : "Başlatılamadı: " + e.message, 5000); });
  }

  function changeSummary() {
    var before = {}, after = {}, add = [], del = [], mod = [];
    originalSources().forEach(function (s) { before[s.id] = s; });
    S.catalog.sources.forEach(function (s) { after[s.id] = s; });
    S.catalog.sources.forEach(function (s) { if (!before[s.id]) add.push(s.name); else if (JSON.stringify(before[s.id]) !== JSON.stringify(s)) mod.push(s.name); });
    originalSources().forEach(function (s) { if (!after[s.id]) del.push(s.name); });
    return { add: add, del: del, mod: mod };
  }
  function save() {
    if (!isDirty() || S.busy) return;
    var c = changeSummary(), parts = [];
    if (c.add.length) parts.push("eklendi: " + c.add.join(", "));
    if (c.mod.length) parts.push("değişti: " + c.mod.join(", "));
    if (c.del.length) parts.push("silindi: " + c.del.join(", "));
    var message = "Kaynaklar güncellendi — " + (parts.join("; ") || "klasörler");
    S.busy = true; render();
    var body = currentJSON();
    gh("/contents/sources.json", { method: "PUT", body: { message: message.slice(0, 200), content: b64encode(body), sha: S.sha, branch: BRANCH } })
      .then(function (d) {
        S.sha = d.content.sha; S.original = body; S.busy = false; S.form = null; render();
        toast("Kaydedildi. Ajan birkaç dakika içinde çalışıp akışı güncelleyecek.", 5000);
        S.expectAfter = Date.now(); S.run = { status: "queued" }; render();
        setTimeout(loadRun, 5000); startPolling();
      })
      .catch(function (e) {
        S.busy = false; render();
        if (e.status === 409) { toast("Kaynak listesi başka bir yerden değişmiş. Liste yeniden yüklendi; değişikliğinizi tekrar yapın.", 6000); loadCatalog().then(render); }
        else if (e.status === 403 || e.status === 404) toast("Kaydedilemedi: anahtarın Contents için yazma izni yok.", 6000);
        else toast("Kaydedilemedi: " + e.message, 6000);
      });
  }
  function discard() { S.catalog = JSON.parse(S.original); S.form = null; S.confirmDel = null; render(); }
  function logout() { stopPolling(); writeToken(null); S.token = null; S.catalog = null; S.status = null; S.run = null; S.form = null; render(); }

  // ---------------------------------------------------------------- form
  function openForm(src) {
    S.confirmDel = null;
    if (src) S.form = { mode: "edit", id: src.id, type: typeOf(src), name: src.name, folder: src.folder, addr: addressOf(src), home: src.method === "crossref" ? (src.home || "") : "", ini: src.ini || "", newFolder: "", error: "" };
    else S.form = { mode: "add", type: "rss", name: "", folder: (S.catalog.folders[0] || {}).id || "", addr: "", home: "", ini: "", newFolder: "", error: "" };
    render();
    var f = document.getElementById("f-type"); if (f) { f.closest(".card").scrollIntoView({ block: "start", behavior: "smooth" }); setTimeout(function () { (document.getElementById(src ? "f-name" : "f-type") || f).focus(); }, 250); }
  }
  function submitForm() {
    var F = S.form, t = TYPE[F.type], name = F.name.trim(), err = "";
    var existing = F.mode === "edit" ? S.catalog.sources.filter(function (s) { return s.id === F.id; })[0] : null;
    var folderId = F.folder;
    if (!name) err = "Kaynağın adını yazın.";
    if (!err && folderId === "__new") {
      var fname = F.newFolder.trim();
      if (!fname) err = "Yeni klasörün adını yazın.";
      else {
        var match = S.catalog.folders.filter(function (f) { return f.name.toLocaleLowerCase("tr-TR") === fname.toLocaleLowerCase("tr-TR"); })[0];
        if (match) folderId = match.id;
        else { var taken = {}; S.catalog.folders.forEach(function (f) { taken[f.id] = 1; }); folderId = uniqueId(slug(fname), taken); F._newFolder = { id: folderId, name: fname }; }
      }
    }
    var addr = F.addr.trim(), src = existing ? JSON.parse(JSON.stringify(existing)) : {};
    var method = F.type.indexOf("yt-") === 0 ? "youtube" : F.type;
    var addrChanged = !existing || typeOf(existing) !== F.type || addressOf(existing) !== addr;
    if (!err) {
      if (method === "crossref") {
        var issn = normIssn(addr);
        if (!issn) err = "ISSN 8 haneli olmalı (ör. 0360-1315).";
        else { addr = issn; if (F.home.trim() && !isHttp(cleanUrl(F.home))) err = "Dergi sayfası geçerli bir web adresi olmalı."; }
      } else {
        addr = cleanUrl(addr);
        if (!isHttp(addr)) err = t.field + " geçerli bir web adresi olmalı (https:// ile başlayan).";
        else if (method === "youtube" && !/(^|\.)youtube\.com$/i.test(new URL(addr).hostname)) err = "YouTube kanal adresi youtube.com ile başlamalı.";
      }
    }
    if (!err) {
      var dup = S.catalog.sources.filter(function (s) { return s.id !== (existing && existing.id) && typeOf(s) === F.type && addressOf(s).replace(/\/+$/, "").toLowerCase() === addr.replace(/\/+$/, "").toLowerCase(); })[0];
      if (dup) err = "Bu adres zaten listede: " + dup.name + ".";
    }
    if (err) { F.error = err; render(); var e = document.getElementById("f-error"); if (e) e.focus(); return; }

    if (F._newFolder) { S.catalog.folders.push(F._newFolder); F._newFolder = null; }
    if (addrChanged) ["home", "feed", "channel", "issn", "page", "kind"].forEach(function (k) { delete src[k]; });
    src.name = name; src.folder = folderId; src.ini = (F.ini.trim() || autoIni(name)).slice(0, 3); src.method = method;
    if (method === "rss" && addrChanged) src.home = addr;
    if (method === "youtube") { if (addrChanged) src.home = addr.split("?")[0]; src.kind = F.type === "yt-long" ? "long" : "shorts"; }
    if (method === "crossref") { src.issn = addr; src.home = cleanUrl(F.home) || src.home || ("https://portal.issn.org/resource/ISSN/" + addr); if (!F.home.trim() && addrChanged) src.home = "https://portal.issn.org/resource/ISSN/" + addr; }
    if (method === "page" && addrChanged) { src.home = addr; src.page = addr; }
    if (existing) {
      var i = S.catalog.sources.indexOf(existing); S.catalog.sources[i] = src;
    } else {
      var ids = {}; S.catalog.sources.forEach(function (s) { ids[s.id] = 1; });
      src = Object.assign({ id: uniqueId(slug(name), ids) }, src);
      S.catalog.sources.push(src);
    }
    S.form = null; render();
    toast(existing ? "Değişiklik listeye işlendi. Kaydetmeyi unutmayın." : "Kaynak listeye eklendi. Kaydetmeyi unutmayın.");
  }

  // ---------------------------------------------------------------- gorunum
  function render() {
    var v = document.getElementById("view"); v.textContent = "";
    if (!S.token || !S.catalog) renderAuth(v); else renderPanel(v);
    var bar = document.getElementById("savebar"), dirty = S.token && S.catalog && isDirty();
    bar.hidden = !dirty;
    if (dirty) {
      var c = changeSummary(), n = c.add.length + c.mod.length + c.del.length;
      document.getElementById("savetext").textContent = S.busy ? "Kaydediliyor…" : (n ? n + " kaynakta kaydedilmemiş değişiklik" : "Kaydedilmemiş değişiklik");
      document.getElementById("save").disabled = S.busy; document.getElementById("discard").disabled = S.busy;
    }
  }

  function renderAuth(v) {
    var c = el("section", "card stack");
    c.appendChild(el("h1", null, "Kaynakları yönet"));
    c.appendChild(el("p", "muted", "Bu sayfadan Radar'a kaynak ekleyip çıkarabilir, kaynakları geçici olarak kapatabilirsiniz. Değişiklikler GitHub'daki kaynak listesine kaydedilir ve ajan birkaç dakika içinde yeni listeyle çalışır."));
    if (S.authError) { var m = el("div", "msg bad", S.authError); m.setAttribute("role", "alert"); c.appendChild(m); }
    var f = el("form", "stack");
    var fld = el("div", "field");
    var lab = el("label", null, "GitHub erişim anahtarı"); lab.htmlFor = "token";
    var inp = el("input"); inp.type = "password"; inp.id = "token"; inp.autocomplete = "off"; inp.placeholder = "github_pat_…"; inp.spellcheck = false;
    fld.appendChild(lab); fld.appendChild(inp);
    fld.appendChild(el("div", "hint", "Anahtar yalnızca bu cihazda saklanır. Ortak bir bilgisayarda işiniz bitince Çıkış'a basın."));
    f.appendChild(fld);
    var row = el("div", "row"); var b = el("button", "btn primary", S.busy ? "Bağlanıyor…" : "Bağlan"); b.type = "submit"; b.disabled = S.busy; row.appendChild(b); f.appendChild(row);
    f.addEventListener("submit", function (e) { e.preventDefault(); var t = inp.value.trim(); if (t) connect(t); else inp.focus(); });
    c.appendChild(f);
    v.appendChild(c);

    var h = el("section", "card stack");
    h.appendChild(el("h3", null, "Anahtar nasıl alınır?"));
    var ol = el("ol", "steps");
    function li(parts) { var x = el("li"); parts.forEach(function (p) { if (typeof p === "string") x.appendChild(document.createTextNode(p)); else x.appendChild(p); }); ol.appendChild(x); }
    var a = el("a", null, "GitHub'da yeni anahtar sayfasını açın"); a.href = "https://github.com/settings/personal-access-tokens/new"; a.target = "_blank"; a.rel = "noopener";
    li([a, "."]);
    li(["Ad olarak ", el("code", null, "Radar yönetim"), " yazın, bir son kullanma tarihi seçin (ör. 1 yıl)."]);
    li(["Repository access: ", el("b", null, "Only select repositories"), " → ", el("code", null, REPO), "."]);
    li(["Repository permissions altında ", el("b", null, "Contents"), " ve ", el("b", null, "Actions"), " için ", el("b", null, "Read and write"), " seçin."]);
    li([el("b", null, "Generate token"), "'a basın, çıkan anahtarı kopyalayıp yukarıya yapıştırın."]);
    h.appendChild(ol);
    h.appendChild(el("p", "muted small", "Bu anahtar yalnızca bu depoyu değiştirebilir. İstediğiniz zaman aynı GitHub sayfasından silebilirsiniz."));
    v.appendChild(h);
    if (!S.busy) setTimeout(function () { inp.focus(); }, 0);
  }

  function runCard() {
    var c = el("section", "card runcard");
    var info = el("div", "runinfo"), dot = el("span", "dot"), txt = el("div");
    var R = S.run, line = "Son çalışma bilgisi yükleniyor…";
    if (R && R.denied) line = "Çalışma durumunu görmek için anahtara Actions izni gerekiyor.";
    else if (R && R.none) line = "Ajan henüz hiç çalışmadı.";
    else if (R && R.status === "queued") { dot.className = "dot run"; line = "Ajan başlatılıyor…"; }
    else if (R && R.status && R.status !== "completed") { dot.className = "dot run"; line = "Ajan şu an çalışıyor…"; }
    else if (R && R.conclusion) {
      var good = R.conclusion === "success";
      dot.className = "dot " + (good ? "ok" : "bad");
      line = (good ? "Son çalışma başarılı" : "Son çalışma hata verdi") + " · " + when(R.at);
    }
    txt.appendChild(el("div", null, line));
    var sub = el("div", "muted small", (S.login ? "Bağlı hesap: " + S.login + " · " : "") + (S.status && S.status.lastRun ? "Akış son güncellendi: " + when(S.status.lastRun) : ""));
    if (sub.textContent) txt.appendChild(sub);
    info.appendChild(dot); info.appendChild(txt);
    var acts = el("div", "row");
    if (R && R.url) { var a = el("a", "btn", "GitHub'da gör"); a.href = R.url; a.target = "_blank"; a.rel = "noopener"; acts.appendChild(a); }
    var run = btn("btn soft", "Şimdi güncelle", runNow); run.disabled = !!(R && R.status && R.status !== "completed") || isDirty();
    if (isDirty()) run.title = "Önce değişiklikleri kaydedin";
    acts.appendChild(run);
    acts.appendChild(btn("btn", "Çıkış", logout));
    c.appendChild(info); c.appendChild(acts);
    return c;
  }

  function statusChips(s, origIds) {
    var box = el("div", "chips");
    var st = S.status && S.status.sources ? S.status.sources[s.id] : null;
    if (!origIds[s.id]) box.appendChild(el("span", "chip pend", "Yeni · kaydedilmedi"));
    else {
      var o = originalSources().filter(function (x) { return x.id === s.id; })[0];
      if (o && JSON.stringify(o) !== JSON.stringify(s)) box.appendChild(el("span", "chip pend", "Değişti · kaydedilmedi"));
    }
    box.appendChild(el("span", "chip", (TYPE[typeOf(s)] || {}).label || METHOD_LABEL[s.method] || s.method));
    if (s.enabled === false) box.appendChild(el("span", "chip warn", "Kapalı"));
    else if (!st) { if (origIds[s.id]) box.appendChild(el("span", "chip", "Sonraki çalışmada okunacak")); }
    else if (st.ok) box.appendChild(el("span", "chip ok", (st.count || 0) + " içerik"));
    else box.appendChild(el("span", "chip bad", st.note || "Okunamadı"));
    return box;
  }

  function sourceRow(s, origIds) {
    var li = el("li", "src" + (s.enabled === false ? " off" : ""));
    var ini = el("div", "ini", s.ini || autoIni(s.name)); ini.style.background = s.enabled === false ? "var(--faint)" : folderColor(s.folder);
    var main = el("div", "srcmain");
    main.appendChild(el("div", "name", s.name));
    var addr = el("div", "addr", addressOf(s)); addr.title = addressOf(s); main.appendChild(addr);
    var st = S.status && S.status.sources ? S.status.sources[s.id] : null;
    if (st && st.feed) { var fd = el("div", "addr", "Bulunan akış: " + st.feed); fd.title = st.feed; main.appendChild(fd); }
    main.appendChild(statusChips(s, origIds));
    var acts = el("div", "srcacts");
    var sw = btn("switch"); sw.setAttribute("role", "switch"); sw.setAttribute("aria-checked", s.enabled === false ? "false" : "true");
    sw.setAttribute("aria-label", s.name + " açık");
    sw.appendChild(el("span", null, s.enabled === false ? "Kapalı" : "Açık")); sw.appendChild(el("span", "track"));
    sw.addEventListener("click", function () { if (s.enabled === false) delete s.enabled; else s.enabled = false; render(); });
    acts.appendChild(sw);
    if (S.confirmDel === s.id) {
      var cf = el("div", "confirm"); cf.appendChild(el("span", null, "Silinsin mi?"));
      cf.appendChild(btn("linkbtn danger", "Sil", function () { S.catalog.sources = S.catalog.sources.filter(function (x) { return x !== s; }); S.confirmDel = null; render(); }));
      cf.appendChild(btn("linkbtn", "Vazgeç", function () { S.confirmDel = null; render(); }));
      acts.appendChild(cf);
    } else {
      var r = el("div", "row");
      r.appendChild(btn("linkbtn", "Düzenle", function () { openForm(s); }));
      r.appendChild(btn("linkbtn danger", "Sil", function () { S.confirmDel = s.id; S.form = null; render(); }));
      acts.appendChild(r);
    }
    li.appendChild(ini); li.appendChild(main); li.appendChild(acts);
    return li;
  }

  function formCard() {
    var F = S.form, t = TYPE[F.type];
    var c = el("section", "card formcard"), st = el("div", "stack");
    st.appendChild(el("h3", null, F.mode === "edit" ? "Kaynağı düzenle" : "Yeni kaynak"));
    if (F.error) { var m = el("div", "msg bad", F.error); m.id = "f-error"; m.tabIndex = -1; m.setAttribute("role", "alert"); st.appendChild(m); }

    function field(id, label, input, hint) {
      var f = el("div", "field"), l = el("label", null, label); l.htmlFor = id; input.id = id;
      f.appendChild(l); f.appendChild(input); if (hint) f.appendChild(el("div", "hint", hint)); return f;
    }
    var sel = el("select"); TYPES.forEach(function (x) { var o = el("option", null, x.label); o.value = x.key; sel.appendChild(o); }); sel.value = F.type;
    sel.addEventListener("change", function () { F.type = sel.value; F.error = ""; render(); var n = document.getElementById("f-type"); if (n) n.focus(); });
    st.appendChild(field("f-type", "Tür", sel));

    var addr = el("input"); addr.type = F.type === "crossref" ? "text" : "url"; addr.placeholder = t.ph; addr.value = F.addr; addr.spellcheck = false; addr.autocomplete = "off";
    if (F.type === "crossref") addr.inputMode = "text";
    addr.addEventListener("input", function () { F.addr = addr.value; });
    st.appendChild(field("f-addr", t.field, addr, t.hint));

    if (F.type === "crossref") {
      var home = el("input"); home.type = "url"; home.placeholder = "https://… (isteğe bağlı)"; home.value = F.home;
      home.addEventListener("input", function () { F.home = home.value; });
      st.appendChild(field("f-home", "Dergi sayfası", home, "Kaynaklar listesinde dergi adına dokununca açılacak sayfa."));
    }

    var g = el("div", "grid2");
    var name = el("input"); name.type = "text"; name.value = F.name; name.placeholder = "Ör. Computers & Education";
    var ini = el("input"); ini.type = "text"; ini.value = F.ini; ini.maxLength = 3; ini.placeholder = autoIni(F.name);
    name.addEventListener("input", function () { F.name = name.value; ini.placeholder = autoIni(F.name); });
    ini.addEventListener("input", function () { F.ini = ini.value; });
    g.appendChild(field("f-name", "Ad", name));
    g.appendChild(field("f-ini", "Kısaltma", ini, "Küçük resim yoksa görünen 1–3 harf."));
    st.appendChild(g);

    var fs = el("select");
    S.catalog.folders.forEach(function (f) { var o = el("option", null, f.name); o.value = f.id; fs.appendChild(o); });
    var on = el("option", null, "+ Yeni klasör…"); on.value = "__new"; fs.appendChild(on);
    fs.value = F.folder || "__new";
    fs.addEventListener("change", function () { F.folder = fs.value; render(); var n = document.getElementById(F.folder === "__new" ? "f-newfolder" : "f-folder"); if (n) n.focus(); });
    st.appendChild(field("f-folder", "Klasör", fs));
    if (F.folder === "__new") {
      var nf = el("input"); nf.type = "text"; nf.value = F.newFolder; nf.placeholder = "Ör. Türkiye'den kaynaklar";
      nf.addEventListener("input", function () { F.newFolder = nf.value; });
      st.appendChild(field("f-newfolder", "Yeni klasörün adı", nf));
    }

    var row = el("div", "row");
    row.appendChild(btn("btn primary", F.mode === "edit" ? "Değişikliği uygula" : "Listeye ekle", submitForm));
    row.appendChild(btn("btn", "Vazgeç", function () { S.form = null; render(); }));
    st.appendChild(row);
    st.addEventListener("keydown", function (e) { if (e.key === "Enter" && e.target.tagName === "INPUT") { e.preventDefault(); submitForm(); } });
    c.appendChild(st);
    return c;
  }

  function renderPanel(v) {
    v.appendChild(runCard());
    var head = el("div", "row"); head.style.justifyContent = "space-between";
    var h = el("div"); h.appendChild(el("h1", null, "Kaynaklar"));
    var active = S.catalog.sources.filter(function (s) { return s.enabled !== false; }).length;
    h.appendChild(el("p", "muted small", S.catalog.sources.length + " kaynak · " + active + " açık"));
    head.appendChild(h);
    if (!S.form || S.form.mode !== "add") head.appendChild(btn("btn primary", "+ Yeni kaynak", function () { openForm(null); }));
    v.appendChild(head);
    if (S.form && S.form.mode === "add") v.appendChild(formCard());

    var origIds = {}; originalSources().forEach(function (s) { origIds[s.id] = 1; });
    var folders = S.catalog.folders.slice(), known = {};
    folders.forEach(function (f) { known[f.id] = 1; });
    S.catalog.sources.forEach(function (s) { if (!known[s.folder]) { known[s.folder] = 1; folders.push({ id: s.folder, name: s.folder }); } });
    folders.forEach(function (f) {
      var list = S.catalog.sources.filter(function (s) { return s.folder === f.id; });
      var g = el("section", "group");
      var gh2 = el("div", "grouphead"), h2 = el("h2"), sw = el("span", "sw"); sw.style.background = folderColor(f.id);
      h2.appendChild(sw); h2.appendChild(document.createTextNode(f.name + " · " + list.length)); gh2.appendChild(h2);
      if (!list.length) gh2.appendChild(btn("linkbtn danger", "Boş klasörü sil", function () { S.catalog.folders = S.catalog.folders.filter(function (x) { return x.id !== f.id; }); render(); }));
      g.appendChild(gh2);
      if (list.length) {
        var ul = el("ul", "list");
        list.forEach(function (s) {
          if (S.form && S.form.mode === "edit" && S.form.id === s.id) { var li = el("li"); li.style.padding = "8px"; li.appendChild(formCard()); ul.appendChild(li); }
          else ul.appendChild(sourceRow(s, origIds));
        });
        g.appendChild(ul);
      } else g.appendChild(el("p", "muted small", "Bu klasörde kaynak yok."));
      v.appendChild(g);
    });

    var note = el("p", "muted small", "X akışları ve sayfanın görünümü şimdilik buradan değiştirilemiyor. Değişiklikler kaydedilene kadar yalnızca bu sayfada görünür.");
    v.appendChild(note);
  }

  document.getElementById("save").addEventListener("click", save);
  document.getElementById("discard").addEventListener("click", discard);
  window.addEventListener("beforeunload", function (e) { if (isDirty()) { e.preventDefault(); e.returnValue = ""; } });

  render();
  var saved = readToken();
  if (saved) connect(saved);
})();
</script>
</body>
</html>
